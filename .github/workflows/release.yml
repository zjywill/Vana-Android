name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Write signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p key
          echo "$KEYSTORE_BASE64" | base64 --decode > key/vana-release.keystore
          printf '%s\n' \
            "storeFile=key/vana-release.keystore" \
            "storePassword=${STORE_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > keystore.properties

      - name: Build release APK
        run: ./scripts/build-apk.sh

      - name: Upload APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "Vana-${VERSION}.apk"
          gh release upload "$TAG" "Vana-${VERSION}.apk" --clobber
